<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sorgu Odası</title>
  <meta name="description" content="Şüphelileri sorgulayın, yalanları yakalayın, katili bulun.">
  <meta name="theme-color" content="#13110f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sorgu Odası">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <!-- ANA EKRAN -->
  <div class="home" id="home" hidden>
    <header class="home-head">
      <div class="home-kicker">Dedektiflik oyunu</div>
      <h1>Sorgu Odası</h1>
      <p>Şüphelilerin karşısına otur, sorularını sor, yalanlarını yakala ve katili bul. İstersen vakayı yazdırıp kâğıt üzerinde de çözebilirsin.</p>
      <div class="install" id="installBox" hidden>
        <button class="btn primary" id="btnInstall" type="button">Uygulamayı yükle</button>
      </div>
      <p class="install-hint" id="iosHint" hidden>Uygulama gibi kullanmak için Paylaş düğmesine, sonra "Ana Ekrana Ekle"ye dokunun.</p>
    </header>
    <div class="home-top">
      <div class="rank-card" id="rankCard"></div>
      <div class="daily-card" id="dailyCard"></div>
    </div>
    <div class="home-grid" id="homeGrid"></div>
    <div class="home-foot" id="homeFoot"></div>
  </div>

  <!-- OYUN -->
  <div class="game" id="game" hidden>
    <header class="top">
      <div class="brand">
        <button class="btn ghost icon" id="btnHome" type="button" title="Vakalar" aria-label="Vakalar"></button>
        <span class="brand-title" id="caseTitle"></span>
        <span class="lv-chip" id="caseLevel"></span>
        <span class="brand-sub" id="casePlace"></span>
      </div>
      <nav class="top-actions">
        <span class="clock-chip top-clock" hidden></span>
        <button class="btn ghost desk-only" id="btnCase" type="button">Vaka dosyası</button>
        <button class="btn accent" id="btnAccuse" type="button">Suçla</button>
        <button class="btn ghost icon" id="btnReset" type="button" title="Baştan başla" aria-label="Baştan başla"></button>
      </nav>
    </header>

    <main class="layout" id="layout" data-view="sorgu">
      <aside class="panel suspects" id="panelSuspects">
        <h2 class="panel-title">Şüpheliler</h2>
        <ul class="suspect-list" id="suspectList"></ul>
        <div class="stats" id="stats"></div>
      </aside>

      <section class="panel interrogation" id="panelChat">
        <div class="room" id="room"></div>
        <div class="chips" id="chips"></div>
        <form class="composer" id="composer" autocomplete="off">
          <button class="btn ghost" id="btnShow" type="button" title="Defterdeki bir bilgiyi göster">Kanıt göster</button>
          <input class="composer-input" id="input" type="text" maxlength="200" placeholder="Bir soru sor" enterkeyhint="send" autocapitalize="sentences">
          <button class="btn primary" id="btnSend" type="submit">Sor</button>
        </form>
      </section>

      <aside class="panel notebook" id="panelNotes">
        <div class="nb-head">
          <h2 class="panel-title">Defter</h2>
          <span class="nb-count" id="nbCount"></span>
        </div>
        <div class="tabs" role="tablist" id="nbTabs">
          <button class="tab active" data-tab="belge" type="button">Belgeler</button>
          <button class="tab" data-tab="kanit" type="button">Kanıtlar</button>
          <button class="tab" data-tab="ifade" type="button">İfadeler</button>
          <button class="tab" data-tab="bag" type="button">Bağlantılar</button>
        </div>
        <div class="nb-list" id="nbList"></div>
      </aside>
    </main>

    <nav class="mobile-nav" id="mobileNav">
      <button data-view="supheli" type="button" class="active"><span class="lbl">Şüpheliler</span></button>
      <button data-view="defter" type="button"><span class="lbl">Defter</span><span class="dot" id="mobileDot"></span></button>
      <button data-view="vaka" type="button"><span class="lbl">Vaka</span></button>
    </nav>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" type="button" aria-label="Kapat">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- Vakalar: yeni vaka eklemek için buraya bir satır ekleyin -->
  <script src="cases/gece-treni.js?v=5"></script>
  <script src="cases/son-hasat.js?v=5"></script>

  <script src="js/engine.js?v=5"></script>
  <script src="js/portrait.js?v=5"></script>
  <script src="js/docs.js?v=5"></script>
  <script src="js/sound.js?v=5"></script>
  <script src="js/daily.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
</body>
</html>
